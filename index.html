<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Methuselah Noreen Presbitero — Front-End Developer & CS Student</title>
    <meta name="description" content="CS student at UP Cebu building accessible, AI-integrated web applications. Front-end developer with experience in React, Next.js, and Firebase." />
    <meta name="author" content="Methuselah Noreen Presbitero" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#F4F4ED" />
    <link rel="canonical" href="https://mnpresbitero.vercel.app/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="preload" as="image" href="/headshot.svg" fetchpriority="high" media="(min-width: 1100px)" />

    <!-- Open Graph / social share -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Methuselah Noreen Presbitero" />
    <meta property="og:title" content="Methuselah Noreen Presbitero — Front-End Developer & CS Student" />

    <meta property="og:image" content="https://mnpresbitero.vercel.app/share.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', '#070B14');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
